name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  runner-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax
        shell: bash
        run: |
          bash -n scripts/deep-review.sh
          bash -n skills/deep-review/scripts/deep-review.sh
          bash -n skills/deep-review/scripts/deep-review-engine.sh
          bash -n skills/deep-review/scripts/deep-review-provider-shim.sh
          bash -n skills/deep-review/scripts/deep-review-mktemp-shim.sh
          bash -n scripts/test-deep-review-recovery.sh
          bash -n scripts/test-deep-review-efficiency.sh
          bash -n scripts/test-provider-lifecycle.sh

      - name: Queue timeout lifecycle test
        shell: bash
        run: bash -x scripts/test-provider-lifecycle.sh queue

      - name: Cancellation lifecycle test
        shell: bash
        run: bash -x scripts/test-provider-lifecycle.sh cancel

      - name: Execution timeout lifecycle test
        shell: bash
        run: bash -x scripts/test-provider-lifecycle.sh timeout

      - name: Recovery and resource tests
        shell: bash
        run: bash scripts/test-deep-review-recovery.sh

      - name: Efficiency and output tests
        shell: bash
        run: bash scripts/test-deep-review-efficiency.sh

      - name: Runner smoke assertions
        shell: bash
        run: |
          output="$(bash skills/deep-review/scripts/deep-review.sh --help)"
          grep -q -- '--provider codex|claude|copilot|auto' <<<"$output"
          grep -q -- '--changes' <<<"$output"
          grep -q -- '--no-auto-specialists' <<<"$output"
          grep -q -- '--no-resume' <<<"$output"
          grep -q -- '--latest-result' <<<"$output"
          version="$(bash skills/deep-review/scripts/deep-review.sh --version)"
          test "$version" = 'Deep Code Review 1.2.0'
          grep -q 'FULL=.*accessibility-scanner' skills/deep-review/scripts/deep-review-engine.sh
          grep -q 'confidence scorer for a batch' skills/deep-review/scripts/deep-review-engine.sh

  ci-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Strict CI regression tests (no model credentials)
        shell: bash
        run: bash scripts/test-deep-review-ci.sh

      - name: Copilot provider and lifecycle tests (no model credentials)
        shell: bash
        run: bash scripts/test-copilot-provider.sh

      - name: Plugin and reviewer validation
        shell: bash
        run: |
          bash scripts/test-plugin-packaging.sh
          bash scripts/test-reviewer-coverage.sh
          bash scripts/test-reviewer-knowledge.sh
          bash scripts/test-reviewer-fixtures.sh
